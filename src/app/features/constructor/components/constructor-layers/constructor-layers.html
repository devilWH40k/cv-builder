<section aria-labelledby="layers-title">
  <h2 id="layers-title">Layers</h2>
  <div class="layers">
    @for (row of rows(); track row.layer.id) {
      @let layer = row.layer;
      <div class="layer-row" [class.group-row]="layer.children?.length" [style.padding-left.rem]="row.depth">
        @if (renamingId() === layer.id) {
          <div class="layer layer-edit" [class.group-layer]="layer.children?.length">
            <lucide-icon [img]="layerIcons[layer.kind]" [size]="16" aria-hidden="true" />
            <input #layerName class="layer-name" type="text" maxlength="100"
              aria-label="Layer name" [value]="renameDraft()" [disabled]="editor.busy()"
              (input)="renameDraft.set(layerName.value)"
              (blur)="finishRename(layer.id)"
              (keydown.enter)="finishRename(layer.id); renameButton.focus(); $event.preventDefault(); $event.stopPropagation()"
              (keydown.escape)="cancelRename(); renameButton.focus(); $event.preventDefault(); $event.stopPropagation()" />
          </div>
        } @else {
          <button
            type="button"
            class="layer"
            [class.group-layer]="layer.children?.length"
            [title]="layer.label"
            [class.selected]="editor.selectedIds().has(layer.id)"
            [attr.aria-pressed]="editor.selectedIds().has(layer.id)"
            (click)="editor.select(layer.id)"
            (dblclick)="layer.children?.length && toggleGroup(layer.id)"
            (contextmenu)="contextRequested.emit({ event: $event, layerId: layer.id })"
          >
            <lucide-icon [img]="layerIcons[layer.kind]" [size]="16" aria-hidden="true" />
            <span>{{ layer.label }}</span>
            @if (layer.locked) {
              <lucide-icon [img]="LockIcon" [size]="14" aria-hidden="true" />
            }
          </button>
        }
        <button #renameButton type="button" class="rename" [disabled]="editor.busy()"
          [attr.aria-label]="renamingId() === layer.id ? 'Save layer name' : 'Rename ' + layer.label"
          [title]="renamingId() === layer.id ? 'Save name' : 'Rename layer'"
          (pointerdown)="$event.preventDefault()"
          (click)="renamingId() === layer.id ? finishRename(layer.id) : startRename(layer)">
          <lucide-icon [img]="renamingId() === layer.id ? CheckIcon : RenameIcon" [size]="16" aria-hidden="true" />
        </button>
        @if (layer.children?.length) {
          <button type="button" class="expand" [attr.aria-label]="(expanded().has(layer.id) ? 'Collapse ' : 'Expand ') + layer.label"
            [attr.aria-expanded]="expanded().has(layer.id)" (click)="toggleGroup(layer.id)">
            <lucide-icon [img]="expanded().has(layer.id) ? ChevronDownIcon : ChevronRightIcon" [size]="16" aria-hidden="true" />
          </button>
        }
      </div>
    } @empty {
      <p class="hint">Your objects will appear here.</p>
    }
  </div>
</section>
