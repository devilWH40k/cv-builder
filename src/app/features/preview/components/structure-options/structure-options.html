<section aria-labelledby="structure-title">
  <h2 id="structure-title">Structure</h2>
  <div class="options">
    <fieldset>
      <legend>Photo</legend>
      <div class="radio-row">
        <ui-radio name="photo-visibility" value="show" label="Show"
          [checked]="structure().showPhoto !== false"
          (selected)="update({ showPhoto: true })" />
        <ui-radio name="photo-visibility" value="hide" label="Hide"
          [checked]="structure().showPhoto === false"
          (selected)="update({ showPhoto: false })" />
      </div>
    </fieldset>
    <fieldset>
      <legend>Theme</legend>
      <div class="radio-row">
        @for (theme of themes; track theme.value) {
          <ui-radio name="cv-theme" [value]="theme.value" [label]="theme.label"
            [checked]="(structure().theme ?? 'basic') === theme.value"
            (selected)="update({ theme: theme.value })" />
        }
      </div>
    </fieldset>
    <fieldset>
      <legend>Languages/Tech position</legend>
      <div class="radio-row">
        <ui-radio name="sidebar-position" value="left" label="Left"
          [checked]="structure().sidebarPosition === 'left'"
          (selected)="update({ sidebarPosition: 'left' })" />
        <ui-radio name="sidebar-position" value="right" label="Right"
          [checked]="structure().sidebarPosition === 'right'"
          (selected)="update({ sidebarPosition: 'right' })" />
      </div>
    </fieldset>
    <fieldset>
      <legend>Technologies</legend>
      <div class="radio-row">
        <ui-radio name="sidebar-technologies-view" value="blocks" label="Blocks"
          [checked]="structure().sidebarTechnologiesView === 'blocks'"
          (selected)="update({ sidebarTechnologiesView: 'blocks' })" />
        <ui-radio name="sidebar-technologies-view" value="list" label="List"
          [checked]="structure().sidebarTechnologiesView !== 'blocks'"
          (selected)="update({ sidebarTechnologiesView: 'list' })" />
      </div>
    </fieldset>
    <fieldset>
      <legend>Used technologies view</legend>
      <div class="radio-row">
        <ui-radio name="technologies-view" value="blocks" label="Blocks"
          [checked]="structure().technologiesView === 'blocks'"
          (selected)="update({ technologiesView: 'blocks' })" />
        <ui-radio name="technologies-view" value="comma-separated" label="Comma separated"
          [checked]="structure().technologiesView === 'comma-separated'"
          (selected)="update({ technologiesView: 'comma-separated' })" />
      </div>
      <div class="position-options" role="group" aria-labelledby="used-technologies-position-label">
        <p id="used-technologies-position-label">Position</p>
        <div class="radio-row">
          <ui-radio name="technologies-position" value="top" label="Top"
            [checked]="structure().technologiesPosition === 'top'"
            (selected)="update({ technologiesPosition: 'top' })" />
          <ui-radio name="technologies-position" value="bottom" label="Bottom"
            [checked]="structure().technologiesPosition !== 'top'"
            (selected)="update({ technologiesPosition: 'bottom' })" />
        </div>
      </div>
    </fieldset>
  </div>
</section>
