<dialog appDialogOverlay [attr.aria-labelledby]="inputId() + '-title'"
  (cancel)="$event.preventDefault(); cancel()">
  <h2 [id]="inputId() + '-title'">Add custom entry</h2>
  <app-input [inputId]="inputId() + '-name'" label="Entry name" [control]="name" [required]="true" (keydown.enter)="apply($event)">
    @if (name.invalid && name.touched) { <span>Entry name is required.</span> }
  </app-input>
  <div class="main-color-option">
    <app-checkbox [inputId]="inputId() + '-apply-main-color'" label="Apply main color"
      [control]="applyMainColor" />
    <button class="color-help" type="button" aria-label="About applying the main color"
      appTooltip="Applies the main color to your icon, matching the default technology icons.">
      <lucide-icon [img]="HelpIcon" [size]="16" aria-hidden="true" />
    </button>
  </div>
  <app-file-upload [inputId]="inputId() + '-icon'" label="Icon (optional)" [attr.aria-busy]="loading()" [control]="iconFile" mode="icon" [removable]="true" removeLabel="Remove icon" [previewSource]="icon() ?? null"
    accept=".svg,image/svg+xml"
    helpText="SVG only, up to 5 MB.">
    @if (error()) { <span role="alert">{{ error() }}</span> }
  </app-file-upload>
  @if (saveError()) { <p role="alert">{{ saveError() }}</p> }
  <footer [attr.aria-busy]="saving()">
    <button class="cancel" type="button" [disabled]="saving()" (click)="cancel()">Cancel</button>
    <app-button [disabled]="name.invalid || loading() || !!error() || saving()" (click)="apply()">Apply</app-button>
    @if (saveEntry() && !saveOnApply()) {
      <app-button class="apply-save"
        [disabled]="name.invalid || loading() || !!error() || saving()" (click)="applyAndSave()">
        {{ saving() ? 'Saving...' : 'Apply and save' }}
      </app-button>
    }
  </footer>
</dialog>
