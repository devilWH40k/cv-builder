<header class="app-header">
  <div class="header-content">
    <a class="brand" routerLink="/" aria-label="CV Builder home">
      <img src="usense-logo.svg" alt="Usense" width="57" height="68" />
      <span class="brand-title"><span>CV</span><span>Builder</span></span>
    </a>
    <nav class="header-menu" aria-label="Main navigation">
      <button class="menu-item" type="button" aria-label="Import / Export" aria-haspopup="dialog"
        (click)="backup.open()">Import / Export</button>
      <a class="menu-item" routerLink="/experiences" routerLinkActive="active"
        ariaCurrentWhenActive="page">Experiences</a>
      <button class="menu-item" type="button" aria-label="Technologies" aria-haspopup="dialog"
        (click)="technologies.open()">Technologies</button>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" type="button" role="switch"
        [class.is-dark]="themeStore.isDark()" [attr.aria-checked]="themeStore.isDark()"
        aria-label="Dark theme"
        [title]="themeStore.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="themeStore.toggleTheme()">
        <span class="theme-icons" aria-hidden="true">
          <lucide-icon class="theme-icon sun-icon" [img]="SunIcon" [size]="20" />
          <lucide-icon class="theme-icon moon-icon" [img]="MoonIcon" [size]="20" />
        </span>
      </button>
      <a class="guides-link" routerLink="/guides" routerLinkActive="active"
        ariaCurrentWhenActive="page" aria-label="Guides" title="Guides">
        <lucide-icon [img]="GuidesIcon" [size]="20" aria-hidden="true" />
      </a>
    </div>
  </div>
</header>
<app-backup-dialog #backup />
<app-technologies-dialog #technologies />
