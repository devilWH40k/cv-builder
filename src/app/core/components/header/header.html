<header class="app-header">
  <div class="header-content">
    <a class="brand" routerLink="/" aria-label="CV Builder home">
      <img src="logo.png" alt="" width="40" height="40" />
      <span>CV Builder</span>
    </a>
    <div class="header-actions">
      <a class="guides-link" routerLink="/guides" routerLinkActive="active"
        ariaCurrentWhenActive="page" aria-label="Guides" title="Guides">
        <lucide-icon [img]="GuidesIcon" [size]="20" aria-hidden="true" />
      </a>
      <app-dropdown menuId="header-settings" label="Settings" [items]="settingsItems" (selected)="selectSetting($event)">
        <lucide-icon [img]="SettingsIcon" [size]="20" aria-hidden="true" />
      </app-dropdown>
    </div>
  </div>
</header>
<app-backup-dialog />
<app-technologies-dialog />
