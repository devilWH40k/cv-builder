<header class="app-header">
  <div class="header-content">
    <a class="brand" routerLink="/" aria-label="CV Builder home">
      <img src="logo.png" alt="" width="40" height="40" />
      <span>CV Builder</span>
    </a>
    <button class="backup-button" type="button" aria-haspopup="dialog" (click)="backup.open()">
      <lucide-icon [img]="TransferIcon" [size]="20" aria-hidden="true" />
      Import / Export
    </button>
  </div>
</header>
<app-backup-dialog #backup />
