@if (position()) {
  <div #panel class="context-menu" role="menu" [attr.aria-label]="label()" tabindex="-1"
    (contextmenu)="$event.preventDefault(); $event.stopPropagation()">
    @for (item of items(); track item.id) {
      @if (item.separatorBefore) { <div class="menu-separator" role="separator"></div> }
      @if (item.href && !item.disabled) {
        <a role="menuitem" tabindex="-1" [href]="item.href" [target]="item.newTab ? '_blank' : '_self'"
          rel="noopener noreferrer" [attr.data-menu-id]="item.id" (click)="choose(item)">
          @if (item.icon; as icon) { <lucide-icon [img]="icon" [size]="18" aria-hidden="true" /> }
          {{ item.label }}
        </a>
      } @else {
        <button type="button" role="menuitem" tabindex="-1" [disabled]="item.disabled"
          [attr.data-menu-id]="item.id" (click)="choose(item)">
          @if (item.icon; as icon) { <lucide-icon [img]="icon" [size]="18" aria-hidden="true" /> }
          {{ item.label }}
        </button>
      }
    }
  </div>
}
