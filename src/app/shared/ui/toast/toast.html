<section class="toast-stack" aria-label="Notifications">
  @for (toast of toasts.messages(); track toast.id) {
    <div class="toast" [class]="'toast ' + toast.theme"
      [attr.role]="toast.theme === 'danger' ? 'alert' : 'status'" aria-atomic="true"
      (mouseenter)="toasts.pause(toast.id)" (mouseleave)="resume(toast.id, $event)"
      (focusin)="toasts.pause(toast.id)" (focusout)="resume(toast.id, $event)">
      <lucide-icon class="theme-icon" [img]="icons[toast.theme]" [size]="20" aria-hidden="true" />
      <div class="content">
        <strong>{{ titles[toast.theme] }}</strong>
        <p>{{ toast.message }}</p>
      </div>
      <button type="button" aria-label="Dismiss notification" (click)="toasts.dismiss(toast.id)">
        <lucide-icon [img]="CloseIcon" [size]="18" aria-hidden="true" />
      </button>
    </div>
  }
</section>
