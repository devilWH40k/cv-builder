<div class="field" [class.invalid]="invalid()" [class.success]="success()">
  <div class="control-wrap">
    <input class="control" [id]="inputId()" [type]="type()" [formControl]="control()"
      [autocomplete]="autocomplete()" [required]="required()" placeholder=" "
      [attr.aria-invalid]="invalid()" [attr.aria-describedby]="helpText() ? inputId() + '-hint ' + inputId() + '-error' : inputId() + '-error'" />
    <label [for]="inputId()">{{ label() }}{{ required() ? ' *' : '' }}</label>
    @if (success()) {
      <span class="success-icon" aria-hidden="true">
        <lucide-icon [img]="CheckIcon" [size]="18" />
      </span>
    }
  </div>
  @if (helpText()) {
    <p class="hint" [id]="inputId() + '-hint'">{{ helpText() }}</p>
  }
  <div class="error" [hidden]="!!helpText() && !invalid()" [id]="inputId() + '-error'" aria-live="polite">
    <ng-content />
  </div>
</div>
