<div role="separator" tabindex="0" [attr.aria-orientation]="axis() === 'vertical' ? 'horizontal' : 'vertical'"
  [attr.aria-label]="label()" [attr.aria-valuemin]="min()" [attr.aria-valuemax]="max()"
  [attr.aria-valuenow]="size()" [attr.aria-valuetext]="size() + ' pixels'"
  (pointerdown)="start($event)" (pointermove)="move($event)"
  (pointerup)="stop()" (pointercancel)="stop()" (lostpointercapture)="stop()"
  (keydown)="keyboard($event)"></div>
