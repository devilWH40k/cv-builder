<ui-dialog dialogId="delete-confirmation" [title]="title()" (dismissed)="cancelled.emit()">
  <p>Are you sure you want to delete <strong>{{ itemName() }}</strong>?</p>
  <p class="message">{{ message() }}</p>
  <div dialogActions class="actions">
    <ui-button class="cancel" variant="monochrome" (click)="cancelled.emit()">Cancel</ui-button>
    <ui-button class="confirm-delete" variant="danger" (click)="confirmed.emit()">Delete</ui-button>
  </div>
</ui-dialog>
