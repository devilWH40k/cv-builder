<dialog #card class="joyride" appDialogOverlay aria-labelledby="joyride-title" aria-describedby="joyride-description"
  (cancel)="dismiss($event)" (keydown)="keyboard($event)"
  [style.left.px]="position().left" [style.top.px]="position().top">
  <div class="spotlight" aria-hidden="true" [style.left.px]="highlight().left"
    [style.top.px]="highlight().top" [style.width.px]="highlight().width"
    [style.height.px]="highlight().height"></div>
  <div class="content">
    <p class="progress" aria-live="polite">Step {{ index() + 1 }} of {{ steps().length }}</p>
    <h2 id="joyride-title">{{ step()?.title }}</h2>
    <p id="joyride-description">{{ step()?.description }}</p>
    <footer>
      @if (last()) {
        <button type="button" class="secondary-button" [disabled]="index() === 0" (click)="move(-1)">Prev</button>
        <app-button (click)="dismiss()">Finish</app-button>
      } @else {
        <button type="button" class="secondary-button" (click)="dismiss()">Skip</button>
        <div class="navigation">
          <button type="button" class="secondary-button" [disabled]="index() === 0" (click)="move(-1)">Prev</button>
          <app-button (click)="move(1)">Next</app-button>
        </div>
      }
    </footer>
  </div>
</dialog>
