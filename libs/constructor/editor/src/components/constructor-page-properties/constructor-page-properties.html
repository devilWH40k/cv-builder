<section aria-labelledby="page-properties-title">
  <h2 id="page-properties-title">Page properties</h2>
  <label>Background color
    <input #color type="color" [value]="editor.backgroundColor()" [disabled]="editor.busy()"
      uiDebouncedColor (colorCommitted)="editor.setBackgroundColor($event)"
 />
  </label>
  <ui-button variant="outline" [disabled]="editor.busy()" (click)="image.click()">
    <lucide-icon [img]="ImageIcon" [size]="16" />
    {{ editor.hasBackgroundImage() ? 'Replace image' : 'Background image' }}
  </ui-button>
  @if (editor.hasBackgroundImage()) {
    <ui-button variant="outline" [disabled]="editor.busy()" (click)="editor.removeBackgroundImage()">
      <lucide-icon [img]="RemoveIcon" [size]="16" />Remove image
    </ui-button>
  }
  <p class="hint">Applies to this page. Images fill the page and are cropped to fit.</p>
  <input #image type="file" accept="image/png,image/jpeg,image/webp" hidden (change)="upload(image)" />
</section>
